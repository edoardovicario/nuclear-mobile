name: Original Nuclear mobile portability
on:
  workflow_dispatch:
  push:
    branches: [original-mobile]
permissions:
  contents: read
concurrency:
  group: original-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@nuclearplayer/player^...' build
      - run: pnpm --filter @nuclearplayer/player build:frontend
  android:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Configure Android SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@nuclearplayer/player^...' build
      - run: pnpm --filter @nuclearplayer/player tauri android init --ci
      - run: pnpm --filter @nuclearplayer/player tauri android build --debug --apk --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: original-nuclear-android-debug
          path: packages/player/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
  ios-simulator:
    runs-on: macos-15
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@nuclearplayer/player^...' build
      - run: pnpm --filter @nuclearplayer/player tauri ios init --ci
      - run: pnpm --filter @nuclearplayer/player tauri ios build --debug --target aarch64-sim --ci
