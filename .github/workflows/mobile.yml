name: Nuclear Mobile
on:
  workflow_dispatch:
  push:
    branches: [mobile-port]
    paths:
      - 'packages/player/mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'packages/player/mobile/**'
      - '.github/workflows/mobile.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix packages/player/mobile run test
      - run: npm --prefix packages/player/mobile run build
  android:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix packages/player/mobile run android:init -- --ci
      - run: npm --prefix packages/player/mobile run android:build -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: nuclear-mobile-android-debug
          path: packages/player/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
  ios-simulator:
    runs-on: macos-15
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix packages/player/mobile run ios:init -- --ci
      - run: npm --prefix packages/player/mobile run ios:sim
