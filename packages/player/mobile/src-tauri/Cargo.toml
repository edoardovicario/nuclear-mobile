[package]
name = "nuclear-mobile"
version = "0.1.0"
description = "Unofficial mobile adaptation of Nuclear Music Player"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/edoardovicario/nuclear-mobile"

[lib]
name = "nuclear_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
